<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>太阳系 · 三维导览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010207;
  --glass:rgba(10,14,28,.55);
  --glass-hi:rgba(22,30,56,.62);
  --line:rgba(170,190,255,.11);
  --line-hi:rgba(200,215,255,.24);
  --text:#e9edf7;
  --muted:#8e98b0;
  --dim:#5c6680;
  --accent:#ffb454;
  --accent2:#8fd0ff;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:'Noto Sans SC','Space Grotesk',system-ui,-apple-system,'Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ui{transition:opacity .5s ease}
body.noui .ui,body.noui #panel,body.noui #caption{opacity:0!important;pointer-events:none!important}

/* ---------- 标签 ---------- */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;opacity:0;transition:opacity .35s ease;pointer-events:none}
.lbl.on{opacity:1}
.lbl.on .in{pointer-events:auto}
.lbl .in{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:2px 6px}
.lbl .zh{font-size:13px;font-weight:500;letter-spacing:.14em;color:#fff;text-shadow:0 0 6px #000,0 0 14px rgba(0,0,0,.8);white-space:nowrap}
.lbl .py{font:400 10px 'Space Grotesk',sans-serif;letter-spacing:.08em;color:#aab3c8;text-shadow:0 0 6px #000;margin-top:1px;white-space:nowrap}
.lbl .tick{width:1px;height:12px;margin-top:3px;background:linear-gradient(to bottom,var(--c,#fff),transparent);opacity:.8}
.lbl.minor .zh{font-size:11px;font-weight:400;color:#d7dcea}
.lbl.minor .py{display:none}
.lbl.minor .tick{height:7px}
.lbl.region .zh{font-size:11px;letter-spacing:.5em;color:rgba(200,210,235,.55);font-weight:300}
.lbl.region .py{color:rgba(160,170,200,.4);letter-spacing:.3em}
.lbl.region .tick{display:none}
.lbl.region .in{cursor:default}
.lbl .in:hover .zh{color:var(--accent)}

/* ---------- 品牌 ---------- */
.brand{position:fixed;left:30px;top:24px;pointer-events:none}
.brand h1{margin:0;font:900 30px/1 'Noto Serif SC',serif;letter-spacing:.34em;
  background:linear-gradient(100deg,#fff 0%,#ffe2b0 45%,#ffb454 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .py{font:400 12px 'Space Grotesk',sans-serif;letter-spacing:.34em;color:var(--muted);margin-top:10px}
.brand .en{font:500 9.5px 'Space Grotesk',sans-serif;letter-spacing:.52em;color:var(--dim);margin-top:6px}

/* ---------- HUD ---------- */
.hud{position:fixed;right:22px;top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.timebox{padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px}
.date{display:flex;flex-direction:column;align-items:flex-start;min-width:136px}
.date b{font:500 16px 'Space Grotesk','Noto Sans SC',sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.date small{font-size:10px;color:var(--dim);letter-spacing:.2em;margin-top:3px}
.sep{width:1px;height:32px;background:var(--line)}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-hi);transition:.2s}
.ib:hover{background:rgba(255,255,255,.08);border-color:var(--accent)}
.ib svg{width:14px;height:14px;fill:currentColor}
.speed{display:flex;flex-direction:column;gap:6px;width:170px}
.speed .row{display:flex;justify-content:space-between;align-items:baseline}
.speed .row span{font:500 12px 'Space Grotesk','Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
.speed .row small{font-size:10px;color:var(--dim);letter-spacing:.2em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(255,180,84,.25),0 0 12px rgba(255,180,84,.6)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.tb{font-size:11px;letter-spacing:.12em;padding:6px 10px;border-radius:999px;border:1px solid var(--line-hi);color:var(--muted);transition:.2s;white-space:nowrap}
.tb:hover{color:#fff;border-color:var(--accent)}
.toggles{display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:12px;letter-spacing:.1em;padding:7px 12px;border-radius:10px;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tg:hover{color:#fff;background:rgba(255,255,255,.06)}
.tg.on{color:#fff;background:rgba(255,180,84,.14);box-shadow:inset 0 0 0 1px rgba(255,180,84,.35)}
.tg .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.tg.on .dot{background:var(--accent);opacity:1;box-shadow:0 0 8px var(--accent)}
#btnTour.on{background:rgba(143,208,255,.14);box-shadow:inset 0 0 0 1px rgba(143,208,255,.4)}
#btnTour.on .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}

/* ---------- 底部 Dock ---------- */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 7px;border-radius:12px;min-width:58px;transition:background .25s,transform .25s;position:relative}
.dk:hover{background:rgba(255,255,255,.06)}
.dk i{width:22px;height:22px;border-radius:50%;display:block;background:radial-gradient(circle at 34% 30%,var(--c1),var(--c2) 70%,#000 110%);box-shadow:0 0 0 1px rgba(255,255,255,.06);transition:transform .3s}
.dk.small i{width:14px;height:14px;margin:4px 0}
.dk span{font-size:12px;letter-spacing:.12em;color:var(--muted);white-space:nowrap;transition:color .25s}
.dk:hover i{transform:scale(1.15)}
.dk.active{background:rgba(255,255,255,.08)}
.dk.active span{color:#fff}
.dk.active::after{content:"";position:absolute;bottom:2px;left:50%;width:14px;height:2px;border-radius:2px;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 8px var(--accent)}
.dk.ov i{background:none;box-shadow:none;border:1px solid rgba(255,255,255,.35);position:relative}
.dk.ov i::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dk kbd{position:absolute;top:3px;right:5px;font:500 8.5px 'Space Grotesk';color:var(--dim)}
.dsep{width:1px;margin:10px 4px;background:var(--line)}

/* ---------- 信息面板 ---------- */
#panel{position:fixed;right:22px;top:168px;bottom:112px;width:372px;padding:24px 24px 18px;overflow-y:auto;
  transform:translateX(calc(100% + 40px));opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
#panel.open{transform:none;opacity:1}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
#panel .x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--muted);display:grid;place-items:center}
#panel .x:hover{background:rgba(255,255,255,.08);color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chip span{font:400 10px 'Space Grotesk';color:var(--dim);letter-spacing:.1em}
#panel h2{margin:16px 0 0;font:900 40px/1.05 'Noto Serif SC',serif;letter-spacing:.12em}
#panel .sub{display:flex;gap:12px;align-items:baseline;margin-top:8px}
#panel .sub .py{font:500 15px 'Space Grotesk';color:var(--accent);letter-spacing:.06em}
#panel .sub .en{font:400 11px 'Space Grotesk';color:var(--dim);letter-spacing:.34em;text-transform:uppercase}
#panel .tag{margin:16px 0 8px;font-size:15px;font-weight:500;color:#fff;letter-spacing:.06em}
#panel .desc{margin:0;font-size:13.5px;line-height:1.95;color:#bfc6d8;font-weight:300;text-align:justify}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:20px 0 4px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:rgba(8,11,22,.72);padding:10px 12px}
.stats dt{font-size:10.5px;color:var(--dim);letter-spacing:.14em}
.stats dd{margin:4px 0 0;font:500 13px 'Space Grotesk','Noto Sans SC',sans-serif;color:#e6eaf4;font-variant-numeric:tabular-nums}
.live{margin:10px 0 0;font:400 11.5px 'Space Grotesk','Noto Sans SC';color:var(--accent2);letter-spacing:.04em;display:flex;align-items:center;gap:8px;min-height:16px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:pulse 1.6s infinite}
.live:empty{display:none}
@keyframes pulse{50%{opacity:.25}}
.sec{margin:22px 0 10px;font-size:11px;letter-spacing:.3em;color:var(--dim);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.cmp{display:flex;align-items:flex-end;gap:14px}
.cmp svg{flex:none}
.cmp p{margin:0;font-size:12.5px;color:#bfc6d8;line-height:1.8}
.cmp p b{color:#fff;font:600 15px 'Space Grotesk'}
.moons{display:flex;flex-wrap:wrap;gap:6px}
.moons button{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-hi);color:#cfd5e4;transition:.2s}
.moons button:hover{border-color:var(--accent);color:#fff}
.facts{margin:0;padding:0;list-style:none;counter-reset:f}
.facts li{position:relative;padding:0 0 12px 30px;font-size:13px;line-height:1.85;color:#c6cddd;font-weight:300;counter-increment:f}
.facts li::before{content:counter(f,decimal-leading-zero);position:absolute;left:0;top:1px;font:500 11px 'Space Grotesk';color:var(--accent)}
.pnav{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pnav button{font-size:12px;color:var(--muted);letter-spacing:.1em;padding:6px 8px;border-radius:8px}
.pnav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.note{margin-top:12px;font-size:10.5px;color:var(--dim);line-height:1.7}

/* ---------- 电影字幕 ---------- */
#caption{position:fixed;left:30px;bottom:124px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1)}
#caption.show{opacity:1;transform:none}
#caption .ce{font:500 11px 'Space Grotesk';letter-spacing:.6em;color:var(--accent);text-transform:uppercase}
#caption .cz{font:900 64px/1.1 'Noto Serif SC',serif;letter-spacing:.18em;margin-top:8px;text-shadow:0 4px 40px rgba(0,0,0,.6)}
#caption .cp{font:400 16px 'Space Grotesk';color:#c9d0e0;letter-spacing:.3em;margin-top:2px}
#caption .ct{margin-top:14px;font-size:14px;color:#aeb6c9;letter-spacing:.2em;font-weight:300}

/* ---------- 提示 / FPS ---------- */
.hint{position:fixed;left:30px;top:112px;font-size:11px;color:var(--dim);letter-spacing:.08em;line-height:1.95;pointer-events:none}
.hint b{color:var(--muted);font-weight:500}
#fps{position:fixed;left:30px;top:166px;font:500 10px 'Space Grotesk';color:var(--dim);letter-spacing:.12em;pointer-events:none}

/* ---------- 加载 ---------- */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at center,#0a0f22 0%,#010207 70%);transition:opacity 1.4s ease}
#loader.done{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:26px}
.orbits{position:relative;width:150px;height:150px}
.orbits .sun{position:absolute;inset:62px;border-radius:50%;background:radial-gradient(circle,#fff5d8,#ffb454 60%,#ff7a1a);box-shadow:0 0 30px #ffb454,0 0 70px rgba(255,140,40,.5)}
.orbits .o{position:absolute;border:1px solid rgba(255,255,255,.1);border-radius:50%;animation:spin linear infinite}
.orbits .o::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pc)}
.orbits .o1{inset:44px;animation-duration:2.2s;--pc:#c9bfb2}
.orbits .o2{inset:24px;animation-duration:3.6s;--pc:#6fb2ff}
.orbits .o3{inset:0;animation-duration:6s;--pc:#e0b07a}
@keyframes spin{to{transform:rotate(360deg)}}
.ld h2{margin:0;font:900 26px 'Noto Serif SC',serif;letter-spacing:.6em;padding-left:.6em}
.bar{width:240px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s ease;box-shadow:0 0 10px var(--accent)}
#ldTxt{font-size:12px;color:var(--muted);letter-spacing:.2em;min-height:18px}
#fatal{display:none;max-width:420px;text-align:center;line-height:1.9;color:#ffb4a0;font-size:14px}

@media (max-width: 860px){
  .brand{left:16px;top:16px}
  .brand h1{font-size:22px}
  .brand .en{display:none}
  .hud{right:12px;top:12px;left:auto}
  .timebox{padding:8px 10px;gap:10px}
  .date{min-width:0}
  .date b{font-size:13px}
  .speed{width:120px}
  .toggles{max-width:calc(100vw - 24px)}
  .tg{padding:6px 8px;font-size:11px}
  #panel{left:12px;right:12px;width:auto;top:auto;bottom:96px;max-height:48vh}
  #caption{display:none}
  .hint,#fps{display:none}
  .dock{bottom:12px}
  .dk{min-width:50px;padding:7px 6px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels" class="ui"></div>

<header class="brand ui">
  <h1>太阳系</h1>
  <div class="py">Tàiyángxì</div>
  <div class="en">The Solar System · Interactive 3D</div>
</header>

<div class="hud ui">
  <div class="glass timebox">
    <div class="date"><b id="dateTxt">—</b><small>模拟日期</small></div>
    <div class="sep"></div>
    <button class="ib" id="btnPlay" title="暂停 / 继续（空格）"><svg viewBox="0 0 16 16" id="icoPlay"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
    <div class="speed">
      <div class="row"><small>时间流速</small><span id="speedTxt">2 天/秒</span></div>
      <input id="speed" type="range" min="0" max="1000" value="500" aria-label="时间流速">
    </div>
    <button class="tb" id="btnToday" title="回到今天的真实行星位置">今天</button>
  </div>
  <div class="glass toggles">
    <button class="tg on" data-tg="orbits" title="轨道（O）"><span class="dot"></span>轨道</button>
    <button class="tg on" data-tg="labels" title="标签（L）"><span class="dot"></span>标签</button>
    <button class="tg on" data-tg="bloom" title="辉光后期"><span class="dot"></span>辉光</button>
    <button class="tg" id="btnQuality" title="渲染分辨率"><span class="dot"></span><em id="qTxt" style="font-style:normal">画质 · 高</em></button>
    <button class="tg" id="btnTour" title="自动漫游（T）"><span class="dot"></span>漫游</button>
    <button class="tg" id="btnFull" title="全屏"><span class="dot"></span>全屏</button>
  </div>
</div>

<aside id="panel" class="glass ui" aria-live="polite"></aside>

<div id="caption"><div class="ce"></div><div class="cz"></div><div class="cp"></div><div class="ct"></div></div>

<nav class="dock glass ui" id="dock"></nav>

<div class="hint ui">
  <b>拖动</b> 旋转视角 · <b>滚轮</b> 缩放 · <b>点击天体</b> 查看详情<br>
  <b>0–9</b> 快速切换 · <b>Esc</b> 总览 · <b>空格</b> 暂停 · <b>T</b> 漫游 · <b>H</b> 隐藏界面
</div>
<div id="fps" class="ui"></div>

<div id="loader">
  <div class="ld">
    <div class="orbits"><div class="o o3"></div><div class="o o2"></div><div class="o o1"></div><div class="sun"></div></div>
    <h2>太阳系</h2>
    <div class="bar"><i id="ldBar"></i></div>
    <div id="ldTxt">正在初始化…</div>
    <div id="fatal"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }
</script>

const BODIES = [

const GLSL_NOISE = /* glsl */`
#define PI 3.14159265359
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float ss(float a, float b, float x){ float t = clamp((x-a)/(b-a), 0.0, 1.0); return t*t*(3.0-2.0*t); }
float fbm(vec3 p, int oct){
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 10; i++){ if (i >= oct) break; s += a*snoise(p); n += a; p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
  return s/n;
}
float ridge(vec3 p, int oct){
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 10; i++){ if (i >= oct) break; float r = 1.0 - abs(snoise(p)); s += a*r*r; n += a; p = p*2.07 + vec3(3.1, 1.7, 5.3); a *= 0.5; }
  return s/n;
}
`;

const GLSL_BAKE_COMMON = /* glsl */`
vec3 hash33(vec3 p){ p = fract(p*vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx)*p.zyx); }
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y)*p.z); }
vec3 uvDir(vec2 uv){ float phi = uv.x*2.0*PI; float th = (1.0 - uv.y)*PI; return vec3(-cos(phi)*sin(th), cos(th), sin(phi)*sin(th)); }
vec3 llDir(float la, float lo){ return vec3(-cos(lo)*cos(la), sin(la), sin(lo)*cos(la)); }
float angDist(vec3 a, vec3 b){ return acos(clamp(dot(a, b), -1.0, 1.0)); }
float craterShape(float d){
  float inside = 1.0 - step(1.0, d);
  float bowl = (d*d - 1.0)*0.8;
  float rim = 0.32*exp(-pow((d - 1.0)*4.5, 2.0));
  float peak = 0.22*exp(-d*d*40.0);
  return bowl*inside + rim + peak*inside;
}
float craterField(vec3 p, float density){
  vec3 cell = floor(p); vec3 f = fract(p); float h = 0.0;
  for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++){
    vec3 o = vec3(float(x), float(y), float(z)); vec3 id = cell + o; vec3 rn = hash33(id);
    if (rn.x > density) continue;
    vec3 c = o + 0.25 + 0.5*hash33(id + 19.19);
    float rad = 0.18 + 0.3*rn.y*rn.y;
    float d = length(f - c)/rad;
    if (d < 1.8) h += craterShape(d)*rad;
  }
  return h;
}
`;

#elif defined(T_SKY)

  col = c*I*0.30;

  col += ss(0.65, 0.9, fbm(d*1.6 + 77.0, 5)*0.5 + 0.5)*vec3(0.15, 0.25, 0.55)*0.035;
  col += vec3(0.008, 0.010, 0.018);

  float s2 = pow(hash13(floor(d*1400.0) + 3.0), 220.0);
  col += vec3(0.9, 0.92, 1.0)*(s1*1.0 + s2*0.6)*(0.35 + 1.4*band);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  h = 1.0;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), clamp(h, 0.0, 1.0));
}
`;

const bakeScene = new THREE.Scene();
const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bakeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
bakeQuad.frustumCulled = false;
bakeScene.add(bakeQuad);
const BAKE_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function bake(type, w, h, uniforms = {}, defs = {}) {
  const rt = new THREE.WebGLRenderTarget(w, h, {
    generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.RepeatWrapping, wrapT: THREE.ClampToEdgeWrapping, anisotropy: MAX_ANISO, depthBuffer: false,
  });
  const mat = new THREE.ShaderMaterial({ vertexShader: BAKE_VS, fragmentShader: BAKE_FS, uniforms, defines: { [type]: 1, ...defs }, depthTest: false, depthWrite: false });
  bakeQuad.material = mat;
  renderer.setRenderTarget(rt);
  renderer.render(bakeScene, bakeCam);
  renderer.setRenderTarget(null);
  mat.dispose();
  return rt.texture;
}

/* ---------- 辅助：随机、条带与光环 1D 贴图 ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const smooth = (t) => t * t * (3 - 2 * t);

function bandTexture(stops, seed) {
  const N = 512, data = new Uint8Array(N * 4), rnd = mulberry32(seed);
  let jit = 0;
  for (let i = 0; i < N; i++) {
    const y = i / (N - 1) * 2 - 1;
    let k = 0; while (k < stops.length - 2 && y > stops[k + 1][0]) k++;
    const [y0, c0] = stops[k], [y1, c1] = stops[k + 1];
    const t = smooth(Math.min(1, Math.max(0, (y - y0) / (y1 - y0))));
    const a = hexRGB(c0), b = hexRGB(c1);
    jit = jit * 0.8 + (rnd() - 0.5) * 0.2;
    for (let j = 0; j < 3; j++) data[i * 4 + j] = Math.max(0, Math.min(255, (a[j] + (b[j] - a[j]) * t) * (1 + jit * 0.22)));
    data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, 1, N);
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

function noise1D(seed, N) {
  const rnd = mulberry32(seed);
  const oct = [[8, 0.5], [32, 0.3], [128, 0.15], [512, 0.05]];
  const tables = oct.map(([n]) => Array.from({ length: n + 1 }, rnd));
  return (t) => {
    let s = 0;
    oct.forEach(([n, amp], k) => { const x = t * n, i = Math.floor(x), f = smooth(x - i); const tb = tables[k]; s += amp * (tb[i] + (tb[Math.min(i + 1, n)] - tb[i]) * f); });
    return s;
  };
}

function ringTexture(kind, inner, outer) {
  const N = 2048, data = new Uint8Array(N * 4);
  const nz = noise1D(kind === 'saturn' ? 11 : 23, N);
  const g = (r, c, w) => Math.exp(-(((r - c) / w) ** 2));
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), r = inner + (outer - inner) * t, n = nz(t);
    let a = 0, c = [200, 185, 160];
    if (kind === 'saturn') {
      if (r < 1.527) { a = 0.08 + 0.14 * (r - 1.24) / 0.287; c = [140, 128, 114]; }
      else if (r < 1.95) { a = 0.62 + 0.3 * smooth(Math.min(1, (r - 1.527) / 0.14)); c = [222, 202, 164]; }
      else if (r < 2.025) { a = 0.05; c = [110, 100, 90]; }
      else if (r < 2.27) { a = 0.55 - 0.1 * (r - 2.025) / 0.245; c = [204, 188, 160]; if (Math.abs(r - 2.214) < 0.006) a = 0.02; if (Math.abs(r - 2.265) < 0.002) a = 0.08; }
      a += 0.75 * g(r, 2.326, 0.004);
      a *= 0.72 + 0.56 * n;
      const k = 0.9 + 0.2 * n; c = c.map(v => v * k);
    } else {
      c = [110, 112, 118];
      a = 0.18 * g(r, 1.64, 0.003) + 0.18 * g(r, 1.66, 0.003) + 0.2 * g(r, 1.68, 0.003) + 0.3 * g(r, 1.75, 0.004) + 0.3 * g(r, 1.79, 0.004)
        + 0.22 * g(r, 1.86, 0.003) + 0.3 * g(r, 1.875, 0.003) + 0.35 * g(r, 1.90, 0.004) + 0.8 * g(r, 1.995, 0.012) + 0.03;
      a *= 0.8 + 0.4 * n;
    }
    data[i * 4] = Math.min(255, c[0]); data[i * 4 + 1] = Math.min(255, c[1]); data[i * 4 + 2] = Math.min(255, c[2]);
    data[i * 4 + 3] = Math.max(0, Math.min(255, a * 255));
  }
  const tex = new THREE.DataTexture(data, N, 1);
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping; tex.needsUpdate = true;
  return tex;
}

   运行时着色器

const PLANET_VS = /* glsl */`
varying vec2 vUv; varying vec3 vWPos; varying vec3 vWN;
void main(){
  vUv = uv;
  vec4 wp = modelMatrix*vec4(position, 1.0);
  vWPos = wp.xyz;
  vWN = normalize(mat3(modelMatrix)*normal);
  gl_Position = projectionMatrix*viewMatrix*wp;
}`;

const PLANET_FS = /* glsl */`
uniform sampler2D uMap; uniform float uBump;
uniform vec3 uAtm; uniform float uAtmStr;
uniform float uSunI; uniform float uAmb; uniform float uLimb;
uniform vec4 uOcc[4]; uniform int uOccN;
#ifdef EARTH
uniform sampler2D uMap2; uniform float uCloudOff;
#endif
#ifdef NORMALMAP
uniform sampler2D uNormal;
#endif
#ifdef RINGSHADOW
uniform sampler2D uRingTex; uniform vec3 uRingN; uniform vec3 uCenter; uniform vec2 uRingR;
#endif
varying vec2 vUv; varying vec3 vWPos; varying vec3 vWN;
float ss(float a, float b, float x){ float t = clamp((x-a)/(b-a), 0.0, 1.0); return t*t*(3.0-2.0*t); }

float occShadow(vec3 P, vec3 L){
  float s = 1.0;
  for (int i = 0; i < 4; i++){
    if (i >= uOccN) break;
    vec3 oc = uOcc[i].xyz - P; float r = uOcc[i].w;
    float b = dot(oc, L);
    if (b <= 0.0) continue;
    float d = sqrt(max(dot(oc, oc) - b*b, 0.0));
    s *= mix(0.1, 1.0, ss(r*0.5, r*1.2, d));
  }
  return s;
}
#ifdef BUMP
vec3 bumpNormal(vec3 N){
  vec2 dx = dFdx(vUv), dy = dFdy(vUv);
  float h0 = texture2D(uMap, vUv).a;
  float bx = (texture2D(uMap, vUv + dx).a - h0)*uBump;
  float by = (texture2D(uMap, vUv + dy).a - h0)*uBump;
  vec3 sx = dFdx(vWPos), sy = dFdy(vWPos);
  vec3 R1 = cross(sy, N), R2 = cross(N, sx);
  float det = dot(sx, R1);
  vec3 grad = sign(det)*(bx*R1 + by*R2);
  return normalize(abs(det)*N - grad);
}
#endif
#ifdef NORMALMAP
vec3 mapNormal(vec3 N){
  vec3 mn = texture2D(uNormal, vUv).xyz*2.0 - 1.0; mn.xy *= 0.9;
  vec3 q0 = dFdx(vWPos), q1 = dFdy(vWPos); vec2 st0 = dFdx(vUv), st1 = dFdy(vUv);
  vec3 q1p = cross(q1, N), q0p = cross(N, q0);
  vec3 T = q1p*st0.x + q0p*st1.x; vec3 B = q1p*st0.y + q0p*st1.y;
  float det = max(dot(T, T), dot(B, B)); float sc = det == 0.0 ? 0.0 : inversesqrt(det);
  return normalize(T*(mn.x*sc) + B*(mn.y*sc) + N*mn.z);
}
#endif

void main(){
  vec4 A = texture2D(uMap, vUv);
  vec3 alb = pow(A.rgb, vec3(2.2));
  vec3 Ng = normalize(vWN);
  vec3 N = Ng;
#ifdef BUMP
  N = bumpNormal(Ng);
#endif
#ifdef NORMALMAP
  N = mapNormal(Ng);
#endif
  vec3 V = normalize(cameraPosition - vWPos);
  vec3 L = normalize(-vWPos);
  float ndlG = dot(Ng, L);
  float term = ss(-0.06, 0.14, ndlG);
  float sh = occShadow(vWPos, L);
#ifdef RINGSHADOW
  float dn = dot(L, uRingN);
  if (abs(dn) > 1e-4){
    float t = dot(uCenter - vWPos, uRingN)/dn;
    if (t > 0.0){
      float r = length(vWPos + L*t - uCenter);
      float u = (r - uRingR.x)/(uRingR.y - uRingR.x);
      if (u > 0.0 && u < 1.0) sh *= 1.0 - 0.88*texture2D(uRingTex, vec2(u, 0.5)).a;
    }
  }
#endif
  vec3 sunC = vec3(1.0, 0.96, 0.9)*uSunI;
  float lit;
#ifdef GAS
  lit = max((ndlG + 0.08)/1.08, 0.0)*sh;
  alb *= mix(1.0, pow(max(dot(Ng, V), 0.0), 0.35), uLimb);
#else
  lit = max(dot(N, L), 0.0)*term*sh;
#endif
  vec3 col = alb*sunC*lit + alb*uAmb;

#ifdef EARTH
  float ocean = ss(0.47, 0.40, A.a);
  vec4 B = texture2D(uMap2, vUv);
  vec2 cuv = vUv + vec2(uCloudOff, 0.0);
  float cloud = texture2D(uMap2, cuv).r;
  float cshadow = texture2D(uMap2, cuv + vec2(0.0016, 0.0009)).r;
  col *= 1.0 - 0.5*cshadow*term;
  vec3 H = normalize(L + V);
  float nh = max(dot(Ng, H), 0.0);
  float spec = (pow(nh, 300.0)*0.5 + pow(nh, 30.0)*0.06)*ocean*(1.0 - cloud)*term*sh;
  float fres = pow(1.0 - max(dot(Ng, V), 0.0), 5.0);
  col += sunC*spec + vec3(0.06, 0.16, 0.36)*fres*ocean*term*sh*uSunI*0.35;
  vec3 cc = vec3(0.97)*(sunC*max(ndlG, 0.0)*term*sh + uAmb);
  col = mix(col, cc, clamp(cloud*1.05, 0.0, 1.0));
  float night = 1.0 - ss(-0.14, 0.06, ndlG);
  col += vec3(1.0, 0.70, 0.36)*pow(B.g, 1.3)*2.4*night*(1.0 - cloud*0.8);
  float tw = ss(-0.12, 0.0, ndlG)*ss(0.22, 0.0, ndlG);
  col += vec3(1.0, 0.42, 0.18)*tw*0.02*uSunI;
#endif

  float rim = pow(1.0 - max(dot(Ng, V), 0.0), 3.0);
  col += uAtm*rim*uAtmStr*ss(-0.3, 0.6, ndlG)*sh*uSunI*0.5;
  gl_FragColor = vec4(col, 1.0);
}`;

const ATM_VS = `varying vec3 vObj; void main(){ vObj = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
const ATM_FS = /* glsl */`
uniform vec3 uCamObj; uniform vec3 uSunObj; uniform vec3 uColor; uniform float uR; uniform float uStr; uniform float uSunI;
varying vec3 vObj;
float ss(float a, float b, float x){ float t = clamp((x-a)/(b-a), 0.0, 1.0); return t*t*(3.0-2.0*t); }
void main(){
  vec3 rd = normalize(vObj - uCamObj);
  float tca = dot(-uCamObj, rd);
  vec3 cp = uCamObj + rd*tca;
  float h = length(cp);
  float x = clamp((1.0 - h)/(1.0 - uR), 0.0, 1.0);
  float dens = pow(x*x*(3.0 - 2.0*x), 1.6);
  vec3 n = normalize(cp);
  vec3 L = normalize(uSunObj);
  float nl = dot(n, L);
  float day = ss(-0.3, 0.4, nl);
  float fwd = pow(max(dot(rd, L), 0.0), 10.0)*ss(-0.7, 0.0, nl)*1.6;
  gl_FragColor = vec4(uColor*dens*(day + fwd)*uStr*uSunI*0.45, 1.0);
}`;

const RING_VS = /* glsl */`
varying vec3 vWPos; varying vec2 vLocal;
void main(){ vLocal = position.xy; vec4 wp = modelMatrix*vec4(position, 1.0); vWPos = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`;
const RING_FS = /* glsl */`
uniform sampler2D uRingTex; uniform vec2 uRingR; uniform vec3 uCenter; uniform float uPR; uniform vec3 uRingN; uniform float uSunI; uniform float uAlpha;
varying vec3 vWPos; varying vec2 vLocal;
float ss(float a, float b, float x){ float t = clamp((x-a)/(b-a), 0.0, 1.0); return t*t*(3.0-2.0*t); }
void main(){
  float r = length(vLocal);
  float u = (r - uRingR.x)/(uRingR.y - uRingR.x);
  if (u < 0.0 || u > 1.0) discard;
  vec4 t = texture2D(uRingTex, vec2(u, 0.5));
  vec3 alb = pow(t.rgb, vec3(2.2));
  vec3 L = normalize(-vWPos); vec3 V = normalize(cameraPosition - vWPos);
  vec3 oc = uCenter - vWPos; float b = dot(oc, L); float sh = 1.0;
  if (b > 0.0){ float d = sqrt(max(dot(oc, oc) - b*b, 0.0)); sh = mix(0.03, 1.0, ss(uPR*0.96, uPR*1.03, d)); }
  float ln = dot(L, uRingN), vn = dot(V, uRingN);
  float same = step(0.0, ln*vn);
  float trans = mix((1.0 - t.a)*0.9 + 0.1, 1.0, same);
  float fwd = pow(max(dot(-V, L), 0.0), 6.0)*(1.0 - t.a)*1.2;
  vec3 col = alb*uSunI*sh*((0.35 + 0.65*abs(ln))*trans + fwd) + alb*0.008;
  gl_FragColor = vec4(col, t.a*uAlpha);
}`;

const SUN_VS = /* glsl */`
varying vec3 vObj; varying vec3 vWN; varying vec3 vWPos;
void main(){ vObj = normalize(position); vec4 wp = modelMatrix*vec4(position, 1.0); vWPos = wp.xyz; vWN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*wp; }`;
const SUN_FS = /* glsl */`
uniform float uClock; uniform float uGain;
varying vec3 vObj; varying vec3 vWN; varying vec3 vWPos;
${GLSL_NOISE}
void main(){
  vec3 p = vObj; float t = uClock*0.02;
  vec3 w = vec3(fbm(p*2.0 + t, 3), fbm(p*2.0 + 5.2 - t, 3), fbm(p*2.0 + 9.7 + t*0.5, 3));
  float n1 = fbm(p*3.0 + w*0.8, 4);
  float g = pow(1.0 - abs(snoise(p*34.0 + w*2.0 + vec3(0.0, t*4.0, 0.0))), 3.0);
  float g2 = 1.0 - abs(snoise(p*85.0 - vec3(t*6.0)));
  float sf = fbm(p*2.2 + vec3(20.0) + t*0.1, 4)*0.5 + 0.5;
  float spots = ss(0.74, 0.78, sf), pen = ss(0.69, 0.74, sf);
  float heat = 0.32 + 0.38*n1 + 0.32*g + 0.08*g2 - pen*0.3 - spots*0.45;
  vec3 col = mix(vec3(0.62, 0.08, 0.0), vec3(1.0, 0.36, 0.02), ss(0.05, 0.45, heat));
  col = mix(col, vec3(1.0, 0.66, 0.2), ss(0.45, 0.8, heat));
  col = mix(col, vec3(1.0, 0.9, 0.62), ss(0.8, 1.05, heat));
  vec3 V = normalize(cameraPosition - vWPos);
  float mu = max(dot(normalize(vWN), V), 0.0);
  col *= 0.38 + 0.62*pow(mu, 0.45);
  col = mix(col*vec3(1.0, 0.5, 0.2), col, ss(0.0, 0.4, mu));
  col += vec3(1.0, 0.65, 0.25)*g*(1.0 - mu)*0.25;
  col *= uGain*(1.0 - spots*0.75);
  gl_FragColor = vec4(col, 1.0);
}`;

const CORONA_VS = `varying vec2 vQ; void main(){ vQ = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
const CORONA_FS = /* glsl */`
uniform float uClock; uniform float uGain; uniform float uR;
varying vec2 vQ;
${GLSL_NOISE}
void main(){
  vec2 q = vQ/uR; float r = length(q); float a = atan(q.y, q.x); vec2 cs = vec2(cos(a), sin(a));
  float rr = max(r, 1.0);
  float glow = 1.0*exp(-(rr - 1.0)*3.4) + 0.26*exp(-(rr - 1.0)*0.95) + 0.04/(rr*rr);
  float rays = fbm(vec3(cs*2.2, uClock*0.04 - rr*0.25), 4)*0.5 + 0.5;
  float fine = snoise(vec3(cs*9.0, uClock*0.06 - rr*0.4))*0.5 + 0.5;
  float I = glow*(0.55 + 0.9*rays*rays + 0.25*fine);
  I *= 1.0 - ss(3.4, 5.0, r);
  vec3 col = mix(vec3(1.0, 0.42, 0.10), vec3(1.0, 0.78, 0.48), exp(-(rr - 1.0)*2.0))*I*uGain;
  gl_FragColor = vec4(col, 1.0);
}`;

const ORBIT_VS = `attribute float aT; varying float vT; void main(){ vT = aT; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
const ORBIT_FS = /* glsl */`
uniform vec3 uColor; uniform float uHead; uniform float uOpacity; varying float vT;
void main(){ float d = fract(uHead - vT); float a = 0.10 + 0.9*pow(1.0 - d, 3.0); gl_FragColor = vec4(uColor*a*uOpacity, 1.0); }`;

const SKY_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
const SKY_FS = `uniform sampler2D uSky; uniform float uGain; varying vec2 vUv; void main(){ gl_FragColor = vec4(pow(texture2D(uSky, vUv).rgb, vec3(2.2))*uGain, 1.0); }`;

const STAR_VS = /* glsl */`
attribute float aSize; attribute vec3 aCol; attribute float aPh;
uniform float uPR; uniform float uClock; varying vec3 vCol;
void main(){
  vec4 mv = modelViewMatrix*vec4(position, 1.0); gl_Position = projectionMatrix*mv;
  float tw = 0.82 + 0.18*sin(uClock*(1.3 + aPh*2.2) + aPh*40.0);
  vCol = aCol*tw; gl_PointSize = aSize*uPR;
}`;
const STAR_FS = `varying vec3 vCol; void main(){ vec2 c = gl_PointCoord*2.0 - 1.0; float r2 = dot(c, c); if (r2 > 1.0) discard; float a = exp(-r2*5.0) + 0.6*exp(-r2*30.0); gl_FragColor = vec4(vCol*a, 1.0); }`;

const DUST_VS = /* glsl */`
attribute vec4 aOrb; attribute float aB;
uniform float uDays; uniform float uPR; uniform float uSize; varying float vB;
void main(){
  float ang = aOrb.y + uDays*aOrb.z;
  vec3 p = vec3(cos(ang)*aOrb.x, aOrb.w, -sin(ang)*aOrb.x);
  vec4 mv = modelViewMatrix*vec4(p, 1.0); gl_Position = projectionMatrix*mv;
  gl_PointSize = clamp(uSize*uPR*300.0/-mv.z, 1.0, 5.0*uPR);
  vB = aB*clamp(-mv.z/40.0, 0.0, 1.0);
}`;
const DUST_FS = `uniform vec3 uColor; varying float vB; void main(){ vec2 c = gl_PointCoord*2.0 - 1.0; float r2 = dot(c, c); if (r2 > 1.0) discard; gl_FragColor = vec4(uColor*vB*exp(-r2*3.0), 1.0); }`;

/* =====================================================================
   开普勒轨道
   ===================================================================== */
function orbitPosFromM(el, M, aScene, out) {
  const e = el.e;
  let E = M + e * Math.sin(M);
  for (let k = 0; k < 6; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  const xv = Math.cos(E) - e, yv = Math.sqrt(1 - e * e) * Math.sin(E);
  const O = el.O * DEG, w = (el.w - el.O) * DEG, i = el.i * DEG;
  const cO = Math.cos(O), sO = Math.sin(O), cw = Math.cos(w), sw = Math.sin(w), ci = Math.cos(i), si = Math.sin(i);
  const x = xv * (cO * cw - sO * sw * ci) - yv * (cO * sw + sO * cw * ci);
  const y = xv * (sO * cw + cO * sw * ci) + yv * (cO * cw * ci - sO * sw);
  const z = xv * (sw * si) + yv * (cw * si);
  out.set(x * aScene, z * aScene, -y * aScene);   // 黄道坐标 → three.js（y 轴向上）
  return el.a * (1 - e * Math.cos(E));
}
function meanAnomaly(el, days) {
  let M = ((el.L - el.w) * DEG + TAU / el.P * days) % TAU;
  return M < 0 ? M + TAU : M;
}
const J2000 = Date.UTC(2000, 0, 1, 12);
const daysNow = () => (Date.now() - J2000) / 86400000;

/* =====================================================================
   场景构建
   ===================================================================== */
const SPHERE_HI = new THREE.SphereGeometry(1, 160, 80);
const SPHERE_MID = new THREE.SphereGeometry(1, 96, 48);
const SPHERE_LO = new THREE.SphereGeometry(1, 48, 24);
const GAL_N = new V3(-0.25, 0.55, 0.80).normalize();

const bodies = {};          // id -> 运行时对象
const pickables = [];
const labeled = [];
const orbitLines = [];
const shells = [];
const textures = {};

function planetMaterial(o) {
  const defines = {};
  if (o.bump) defines.BUMP = 1;
  if (o.gas) defines.GAS = 1;
  if (o.earth) defines.EARTH = 1;
  if (o.normal) defines.NORMALMAP = 1;
  if (o.ringTex) defines.RINGSHADOW = 1;
  return new THREE.ShaderMaterial({
    vertexShader: PLANET_VS, fragmentShader: PLANET_FS, defines,
    uniforms: {
      uMap:{value:o.map}, uBump:{value:o.bump || 0},
      uAtm:{value:new THREE.Color(o.atm || '#000000')}, uAtmStr:{value:o.atmStr || 0},
      uSunI:U.uSunI, uAmb:{value:o.amb ?? 0.01}, uLimb:{value:o.limb || 0},
      uOcc:{value:[0, 1, 2, 3].map(() => new THREE.Vector4())}, uOccN:{value:0},
      uMap2:{value:o.map2 || null}, uCloudOff:{value:0}, uNormal:{value:o.normal || null},
      uRingTex:{value:o.ringTex || null}, uRingN:{value:new V3(0, 1, 0)}, uCenter:{value:new V3()}, uRingR:{value:new THREE.Vector2()},
    },
  });
}

function makeShell(parent, def) {
  const k = def.atm.shell;
  const m = new THREE.Mesh(SPHERE_MID, new THREE.ShaderMaterial({
    vertexShader: ATM_VS, fragmentShader: ATM_FS, side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uCamObj:{value:new V3()}, uSunObj:{value:new V3()}, uColor:{value:new THREE.Color(def.atm.color)}, uR:{value:1 / k}, uStr:{value:def.atm.shellStr}, uSunI:U.uSunI },
  }));
  m.scale.set(def.r * k, def.r * k * (1 - (def.oblate || 0)), def.r * k);
  parent.add(m);
  shells.push(m);
  return m;
}

function rockGeometry(seed, axes) {
  const g = new THREE.IcosahedronGeometry(1, 2);
  const p = g.attributes.position, rnd = mulberry32(seed), v = new V3();
  const ph = [rnd() * 6, rnd() * 6, rnd() * 6, rnd() * 6];
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = 1 + 0.2 * Math.sin(v.x * 2.3 + ph[0]) * Math.sin(v.y * 2.9 + ph[1]) + 0.14 * Math.sin(v.z * 3.7 + ph[2] + v.x * 1.3) + 0.07 * Math.sin(v.y * 7.1 + ph[3] + v.z * 4.0);
    v.multiplyScalar(n);
    v.set(v.x * axes[0], v.y * axes[1], v.z * axes[2]);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

function makeOrbitLine(points, ts, color, opacity, parent = scene) {
  const g = new THREE.BufferGeometry().setFromPoints(points);
  g.setAttribute('aT', new THREE.Float32BufferAttribute(ts, 1));
  const m = new THREE.ShaderMaterial({ vertexShader: ORBIT_VS, fragmentShader: ORBIT_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uColor:{value:new THREE.Color(color)}, uHead:{value:0}, uOpacity:{value:opacity} } });
  const line = new THREE.Line(g, m);
  line.frustumCulled = false;
  line.userData.baseOpacity = opacity;
  parent.add(line);
  orbitLines.push(line);
  return line;
}

function makeLabel(b, cls = '') {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.innerHTML = `<div class="in" style="--c:${b.color || '#fff'}"><span class="zh">${b.zh}</span><span class="py">${b.py || ''}</span><i class="tick"></i></div>`;
  if (!cls.includes('region')) el.querySelector('.in').addEventListener('click', (e) => { e.stopPropagation(); userInteract(); focusBody(bodies[b.id]); });
  $('#labels').appendChild(el);
  return el;
}

function buildSky() {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 64, 32), new THREE.ShaderMaterial({
    vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false,
    uniforms: { uSky:{value:textures.sky}, uGain:{value:0.85} },
  }));
  sky.renderOrder = -100;
  sky.frustumCulled = false;

  // 恒星点云
  const N = 14000, rnd = mulberry32(42);
  const pos = new Float32Array(N * 3), size = new Float32Array(N), col = new Float32Array(N * 3), ph = new Float32Array(N);
  const SC = [[0.62,0.71,1.0],[0.73,0.80,1.0],[0.86,0.89,1.0],[1.0,0.98,0.96],[1.0,0.93,0.84],[1.0,0.82,0.63],[1.0,0.72,0.45]];
  const W = [0.03,0.08,0.15,0.22,0.22,0.18,0.12];
  const gC = new V3().crossVectors(GAL_N, new V3(0.3, 0.1, 1).normalize()).normalize(), gB = new V3().crossVectors(GAL_N, gC);
  const v = new V3();
  for (let i = 0; i < N; i++) {
    if (rnd() < 0.42) { // 集中于银河带
      const l = rnd() * TAU, b = (rnd() + rnd() + rnd() - 1.5) * 0.22;
      v.copy(gC).multiplyScalar(Math.cos(l) * Math.cos(b)).addScaledVector(gB, Math.sin(l) * Math.cos(b)).addScaledVector(GAL_N, Math.sin(b));
    } else {
      const u = rnd() * 2 - 1, t = rnd() * TAU, s = Math.sqrt(1 - u * u);
      v.set(s * Math.cos(t), u, s * Math.sin(t));
    }
    v.normalize().multiplyScalar(5000);
    pos.set([v.x, v.y, v.z], i * 3);
    const m = Math.pow(rnd(), 9);
    size[i] = 0.9 + m * 2.8 + rnd() * 0.5;
    let x = rnd(), k = 0; while (k < W.length - 1 && (x -= W[k]) > 0) k++;
    const br = 0.1 + m * 2.2 + Math.pow(rnd(), 2) * 0.45;
    col.set(SC[k].map(c => c * br), i * 3);
    ph[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  const stars = new THREE.Points(g, new THREE.ShaderMaterial({ vertexShader: STAR_VS, fragmentShader: STAR_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uPR:U.uPR, uClock:U.uClock } }));
  stars.frustumCulled = false;
  stars.renderOrder = -90;

  const skyGroup = new THREE.Group();
  skyGroup.add(sky, stars);
  scene.add(skyGroup);
  return skyGroup;
}

let sunMat, coronaMat, corona;
function buildSun() {
  const def = BY_ID.sun;
  sunMat = new THREE.ShaderMaterial({ vertexShader: SUN_VS, fragmentShader: SUN_FS, uniforms: { uClock:U.uClock, uGain:{value:3.5} } });
  const node = new THREE.Group(), tilt = new THREE.Group();
  tilt.rotation.z = -def.tilt * DEG;
  const mesh = new THREE.Mesh(SPHERE_HI, sunMat);
  mesh.scale.setScalar(def.r);
  tilt.add(mesh); node.add(tilt); scene.add(node);

  const S = def.r * 5;
  coronaMat = new THREE.ShaderMaterial({ vertexShader: CORONA_VS, fragmentShader: CORONA_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uClock:U.uClock, uGain:{value:1.6}, uR:{value:def.r} } });
  corona = new THREE.Mesh(new THREE.PlaneGeometry(S * 2, S * 2), coronaMat);
  scene.add(corona);

  const light = new THREE.PointLight(0xfff2e0, U.uSunI.value * Math.PI, 0, 0);
  scene.add(light, new THREE.AmbientLight(0x404a60, 0.08));

  const b = { def, id:'sun', node, tilt, mesh, radius:def.r, worldPos:new V3(), spin:0, viewDist:def.view, moons:[] };
  bodies.sun = b; pickables.push(b);
  b.label = makeLabel(def); labeled.push(b);
}

function buildPlanet(def) {
  const b = { def, id:def.id, radius:def.r, worldPos:new V3(), spin:Math.random() * TAU, moons:[], occluders:[] };
  b.node = new THREE.Group(); b.tilt = new THREE.Group();
  b.tilt.rotation.z = -(def.tilt || 0) * DEG;
  b.node.add(b.tilt); scene.add(b.node);

  let ringTex = null;
  if (def.rings) {
    ringTex = ringTexture(def.rings.kind, def.rings.inner, def.rings.outer);
    const ri = def.r * def.rings.inner, ro = def.r * def.rings.outer;
    const rm = new THREE.ShaderMaterial({ vertexShader: RING_VS, fragmentShader: RING_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uRingTex:{value:ringTex}, uRingR:{value:new THREE.Vector2(ri, ro)}, uCenter:{value:new V3()}, uPR:{value:def.r}, uRingN:{value:new V3(0, 1, 0)}, uSunI:U.uSunI, uAlpha:{value:def.rings.alpha} } });
    b.ring = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 256, 1), rm);
    b.ring.rotation.x = -Math.PI / 2;
    b.tilt.add(b.ring);
    b.ringR = new THREE.Vector2(ri, ro);
  }

  b.mat = planetMaterial({
    map: textures[def.id], bump: def.bump ? def.bump * def.r : 0, gas: def.kind === 'gas' || def.kind === 'ice',
    earth: def.earth, map2: def.earth ? textures.earthB : null, normal: def.earth ? textures.earthN : null,
    atm: def.atm?.color, atmStr: def.atm?.str, limb: def.limb, ringTex,
  });
  b.mesh = new THREE.Mesh(def.r > 3 ? SPHERE_HI : SPHERE_MID, b.mat);
  b.mesh.scale.set(def.r, def.r * (1 - (def.oblate || 0)), def.r);
  b.tilt.add(b.mesh);
  if (def.atm) b.shell = makeShell(b.tilt, def);

  // 轨道线（按平近点角均匀采样 → 尾迹亮度与时间对应）
  const el = ELEMENTS[def.id], pts = [], ts = [], N = 720;
  for (let k = 0; k <= N; k++) { const p = new V3(); orbitPosFromM(el, TAU * k / N, def.a, p); pts.push(p); ts.push(k / N); }
  b.orbit = makeOrbitLine(pts, ts, def.color, 0.5);
  b.el = el;
  b.viewDist = def.view || def.r * 4.6;
  bodies[def.id] = b; pickables.push(b);
  b.label = makeLabel(def); labeled.push(b);
}

function buildMoon(def) {
  const P = bodies[def.parent];
  const b = { def, id:def.id, radius:def.r, worldPos:new V3(), parentBody:P, angle:Math.random() * TAU, minor:true, occluders:[P] };
  const o = def.orbit;
  const plane = new THREE.Group();
  plane.rotation.x = (o.inc || 0) * DEG;
  (def.id === 'moon' ? P.node : P.tilt).add(plane);   // 月球轨道近黄道，其余卫星位于母星赤道面
  b.pivot = new THREE.Group(); plane.add(b.pivot);

  if (def.rock) {
    b.mesh = new THREE.Mesh(rockGeometry(def.id.length * 17, def.rock), new THREE.MeshStandardMaterial({ color: 0x8a7a6c, roughness: 1, metalness: 0, flatShading: true }));
    b.mesh.scale.setScalar(def.r);
  } else {
    b.mat = planetMaterial({ map: textures[def.id], bump: def.bump ? def.bump * def.r : 0, atm: def.atm?.color, atmStr: def.atm?.str, amb: 0.012 });
    b.mesh = new THREE.Mesh(def.r > 0.4 ? SPHERE_MID : SPHERE_LO, b.mat);
    b.mesh.scale.setScalar(def.r);
  }
  b.mesh.position.set(o.d, 0, 0);
  b.mesh.rotation.y = Math.PI;      // 潮汐锁定：近地面朝向母星
  b.pivot.add(b.mesh);
  if (def.atm) { b.shell = makeShell(b.pivot, def); b.shell.position.copy(b.mesh.position); }

  const pts = [], ts = [], N = 256, sgn = Math.sign(o.P);
  for (let k = 0; k <= N; k++) { const a = sgn * TAU * k / N; pts.push(new V3(Math.cos(a) * o.d, 0, -Math.sin(a) * o.d)); ts.push(k / N); }
  b.orbit = makeOrbitLine(pts, ts, def.color, 0.35, plane);
  b.orbit.userData.moon = true;
  b.viewDist = def.view || Math.max(def.r * 5, 0.6);
  P.moons.push(b);
  if (!def.rock && P.occluders.length < 4 && def.r > 0.2) P.occluders.push(b);
  bodies[def.id] = b; pickables.push(b);
  b.label = makeLabel(def, def.minor ? 'minor' : ''); labeled.push(b);
}

let beltMats = [];
function buildBelts() {
  const rnd = mulberry32(7);
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  const sampleA = () => { for (;;) { const a = 2.1 + rnd() * 1.2; if ([2.502, 2.825, 2.958, 3.279].some(g => Math.abs(a - g) < 0.028) && rnd() < 0.85) continue; return a; } };
  const toScene = (a) => 86 + (a - 2.1) / 1.2 * 24;

  // 小行星：3 种岩石形状 × 实例化
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8c8075, roughness: 1, metalness: 0, flatShading: true });
  rockMat.onBeforeCompile = (sh) => {
    sh.uniforms.uDays = U.uDays;
    sh.vertexShader = 'attribute vec4 aOrb;\nuniform float uDays;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix*mvPosition;
      #endif
      float ang = aOrb.y + uDays*aOrb.z;
      mvPosition.xyz += vec3(cos(ang)*aOrb.x, aOrb.w, -sin(ang)*aOrb.x);
      mvPosition = modelViewMatrix*mvPosition;
      gl_Position = projectionMatrix*mvPosition;`);
  };
  const PER = 1500, m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), e = new THREE.Euler();
  for (let gI = 0; gI < 3; gI++) {
    const geo = rockGeometry(100 + gI, [1, 0.7 + rnd() * 0.3, 0.6 + rnd() * 0.3]);
    const orb = new Float32Array(PER * 4);
    const im = new THREE.InstancedMesh(geo, rockMat, PER);
    for (let i = 0; i < PER; i++) {
      const a = sampleA();
      orb.set([toScene(a), rnd() * TAU, TAU / (365.25 * Math.pow(a, 1.5)), gauss() * 2.4], i * 4);
      const sz = 0.03 + Math.pow(rnd(), 8) * 0.34 + rnd() * 0.03;
      e.set(rnd() * TAU, rnd() * TAU, rnd() * TAU); q.setFromEuler(e);
      s.set(sz * (0.8 + rnd() * 0.4), sz * (0.8 + rnd() * 0.4), sz * (0.8 + rnd() * 0.4));
      m4.compose(ORIGIN, q, s); im.setMatrixAt(i, m4);
    }
    geo.setAttribute('aOrb', new THREE.InstancedBufferAttribute(orb, 4));
    im.frustumCulled = false;
    scene.add(im);
  }

  // 尘埃 & 柯伊伯带点云
  const dust = (n, aFn, yScale, color, size, bright) => {
    const orb = new Float32Array(n * 4), br = new Float32Array(n);
    for (let i = 0; i < n; i++) { const [aS, aAU] = aFn(); orb.set([aS, rnd() * TAU, TAU / (365.25 * Math.pow(aAU, 1.5)), gauss() * yScale], i * 4); br[i] = bright * (0.3 + rnd() * 0.7); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('aOrb', new THREE.BufferAttribute(orb, 4));
    g.setAttribute('aB', new THREE.BufferAttribute(br, 1));
    const mat = new THREE.ShaderMaterial({ vertexShader: DUST_VS, fragmentShader: DUST_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uDays:U.uDays, uPR:U.uPR, uSize:{value:size}, uColor:{value:new THREE.Color(color)} } });
    const pts = new THREE.Points(g, mat); pts.frustumCulled = false; scene.add(pts);
    beltMats.push(mat);
  };
  dust(7000, () => { const a = sampleA(); return [toScene(a), a]; }, 2.2, '#b8a894', 0.35, 0.55);
  dust(9000, () => { const a = 38 + gauss() * 7 + (rnd() < 0.15 ? rnd() * 12 : 0); return [300 + (a - 40) * 6, a]; }, 9, '#9fb4d8', 0.5, 0.45);

  const reg = [ { zh:'小行星带', py:'Xiǎoxíngxīng Dài', pos:new V3(0, 0, -98) }, { zh:'柯伊伯带', py:'Kēyībó Dài', pos:new V3(-230, 0, 225) } ];
  for (const r of reg) labeled.push({ id:'region', region:true, worldPos:r.pos, radius:0, label:makeLabel(r, 'region') });
}

/* =====================================================================

let focus = null, fly = null;
const lastFocusPos = new V3(), tmpV = new V3(), tmpV2 = new V3();
const OVERVIEW_OFF = new V3(0, 240, 470);
const easeIO = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function focusBody(b, dur) {
  if (!b) return;
  focus = b;
  const tp = b.worldPos;
  let dir;
  if (b.id === 'sun') dir = new V3(0.25, 0.3, 1).normalize();
  else {
    const ref = b.parentBody ? b.parentBody.worldPos : tp;
    const toSun = ref.clone().negate().normalize();
    const side = new V3().crossVectors(new V3(0, 1, 0), toSun).normalize();
    dir = toSun.multiplyScalar(0.6).add(side.multiplyScalar(0.74)).add(new V3(0, b.def.rings ? 0.42 : 0.26, 0)).normalize();
  }
  const d0 = camera.position.distanceTo(tp);
  const portrait = camera.aspect < 1 ? 1 + (1 - camera.aspect) * 2 : 1;   // 竖屏时拉远一些
  fly = { t:0, dur: dur ?? THREE.MathUtils.clamp(1.3 + Math.log10(1 + d0) * 0.62, 1.6, 3.4), p0:camera.position.clone(), t0:controls.target.clone(), body:b, off:dir.multiplyScalar(b.viewDist * portrait) };
  controls.enabled = false;
  renderPanel(b);
  showCaption(b.def);
  setDockActive(b.minor && b.id !== 'moon' ? b.parentBody.id : b.id);
  highlightOrbit(b);
}
function goOverview(dur) {
  focus = null;
  fly = { t:0, dur: dur ?? 2.6, p0:camera.position.clone(), t0:controls.target.clone(), body:null, off:OVERVIEW_OFF.clone() };
  controls.enabled = false;
  panel.classList.remove('open');
  setDockActive('overview');
  highlightOrbit(null);
}
function highlightOrbit(b) {
  for (const l of orbitLines) l.material.uniforms.uOpacity.value = l.userData.baseOpacity * (b ? 0.55 : 1);
  if (b && b.orbit) b.orbit.material.uniforms.uOpacity.value = 1.0;
}

function updateCamera(dt) {
  if (fly) {
    fly.t += dt / fly.dur;
    const k = Math.min(1, fly.t), e = easeIO(k);
    const tp = fly.body ? fly.body.worldPos : ORIGIN;
    tmpV.copy(tp).add(fly.off);
    const span = fly.p0.distanceTo(tmpV);
    camera.position.lerpVectors(fly.p0, tmpV, e);
    camera.position.y += Math.sin(Math.PI * e) * span * 0.14;
    controls.target.lerpVectors(fly.t0, tp, easeIO(Math.min(1, k * 1.25)));
    camera.lookAt(controls.target);
    if (k >= 1) {
      fly = null;
      lastFocusPos.copy(tp);
      controls.minDistance = focus ? focus.radius * 1.3 : 20;
      controls.maxDistance = 2600;
      controls.enabled = true;
      controls.update();
      if (tour.on) tour.t = 0;
    }
  } else {
    const tp = focus ? focus.worldPos : ORIGIN;
    tmpV.subVectors(tp, lastFocusPos);
    camera.position.add(tmpV); controls.target.add(tmpV);
    lastFocusPos.copy(tp);
    controls.update();
  }
  const dist = camera.position.distanceTo(controls.target);
  const near = THREE.MathUtils.clamp(dist * 0.004, 0.004, 4);
  if (Math.abs(near - camera.near) / camera.near > 0.05) { camera.near = near; camera.updateProjectionMatrix(); }
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downPos = null;
canvas.addEventListener('pointerdown', (e) => { downPos = [e.clientX, e.clientY]; userInteract(); });
canvas.addEventListener('wheel', () => userInteract(), { passive:true });
canvas.addEventListener('pointerup', (e) => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
  const b = pick(e.clientX, e.clientY);
  if (b) focusBody(b);
});

  if (e.buttons) return;
  canvas.style.cursor = pick(e.clientX, e.clientY) ? 'pointer' : 'grab';
});
function pick(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  let best = null, bestT = Infinity;
  for (const b of pickables) {
    if (b.minor && !b.label.classList.contains('on')) continue;
    const dist = o.distanceTo(b.worldPos);
    const R = Math.max(b.radius * 1.15, dist * (b.minor ? 0.006 : 0.012));
    tmpV.subVectors(b.worldPos, o);
    const tca = tmpV.dot(d); if (tca < 0) continue;
    const d2 = tmpV.lengthSq() - tca * tca;
    if (d2 > R * R) continue;
    const t = tca - Math.sqrt(R * R - d2);
    const score = b.minor ? t : t * 0.999;
    if (score < bestT) { bestT = score; best = b; }
  }
  return best;
}

/* =====================================================================
   每帧更新
   ===================================================================== */
const soft = (w, cap) => cap * Math.tanh(w / cap);   // 高速时平滑限制自转/卫星角速度，避免频闪
const tmpQ = new THREE.Quaternion();
let skyGroup;

function updateBodies(dt) {
  const eff = paused ? 0 : speed;
  for (const id in bodies) {
    const b = bodies[id];
    if (b.el) {
      const M = meanAnomaly(b.el, simDays);
      b.rAU = orbitPosFromM(b.el, M, b.def.a, b.node.position);
      b.orbit.material.uniforms.uHead.value = M / TAU;
    }
    if (b.def.rotP && b.mesh && !b.minor) {
      b.spin += soft(eff * TAU / b.def.rotP * 0.05, 1.1) * dt;
      b.mesh.rotation.y = b.spin;
    }
    if (b.minor) {
      const P = b.def.orbit.P;
      b.angle += Math.sign(P) * soft(eff * TAU / Math.abs(P), 2.2) * dt;
      b.pivot.rotation.y = b.angle;
      const hd = (Math.sign(P) * b.angle / TAU) % 1;
      b.orbit.material.uniforms.uHead.value = hd < 0 ? hd + 1 : hd;
    }
  }
  if (bodies.earth) bodies.earth.mat.uniforms.uCloudOff.value += soft(eff, 20) * dt * 0.00035;
}

function readWorld() {
  for (const id in bodies) { const b = bodies[id]; b.mesh.getWorldPosition(b.worldPos); }
}

function updateUniforms() {
  const camDistSun = camera.position.length();
  const far = THREE.MathUtils.smoothstep(camDistSun, 30, 160);
  const g = THREE.MathUtils.lerp(1.35, 3.8, far);
  sunMat.uniforms.uGain.value = g;
  coronaMat.uniforms.uGain.value = THREE.MathUtils.lerp(0.55, 1.7, far);
  bloom.strength = THREE.MathUtils.lerp(0.3, 0.9, far);
  corona.quaternion.copy(camera.quaternion);
  skyGroup.position.copy(camera.position);

  for (const id in bodies) {
    const b = bodies[id];
    if (!b.mat) continue;
    const u = b.mat.uniforms;
    const occ = b.occluders || [];
    u.uOccN.value = occ.length;
    for (let i = 0; i < occ.length; i++) u.uOcc.value[i].set(occ[i].worldPos.x, occ[i].worldPos.y, occ[i].worldPos.z, occ[i].radius);
    if (b.ring) {
      const n = tmpV2.set(0, 1, 0).applyQuaternion(b.tilt.getWorldQuaternion(tmpQ));
      u.uRingN.value.copy(n); u.uCenter.value.copy(b.worldPos); u.uRingR.value.copy(b.ringR);
      const ru = b.ring.material.uniforms; ru.uRingN.value.copy(n); ru.uCenter.value.copy(b.worldPos);
    }
  }
  for (const s of shells) {
    s.worldToLocal(s.material.uniforms.uCamObj.value.copy(camera.position));
    s.worldToLocal(s.material.uniforms.uSunObj.value.set(0, 0, 0));
  }
}

const tmpV3 = new V3();
function behind(b, P) {          // P 是否挡在相机与 b 之间
  tmpV2.subVectors(b.worldPos, camera.position);
  const L = tmpV2.length(); tmpV2.divideScalar(L);
  tmpV3.subVectors(P.worldPos, camera.position);
  const t = tmpV3.dot(tmpV2);
  return t > 0 && t < L && tmpV3.lengthSq() - t * t < P.radius * P.radius;
}
function moonContext(b) {
  const P = b.parentBody;
  return (focus === P || (focus && focus.parentBody === P)) && camera.position.distanceTo(P.worldPos) < P.viewDist * 5;
}
function updateLabels() {
  if (!flags.labels) return;
  const w = innerWidth, h = innerHeight, tanF = Math.tan(camera.fov * DEG / 2);
  const camFar = camera.position.length();
  for (const b of labeled) {
    tmpV.copy(b.worldPos).project(camera);
    let vis = tmpV.z > -1 && tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    const dist = camera.position.distanceTo(b.worldPos);
    const pr = b.radius / (dist * tanF) * h / 2;
    if (b.region) vis = vis && !focus && camFar > 260;
    else if (b.minor) vis = vis && moonContext(b) && !behind(b, b.parentBody);
    if (b === focus && pr > 50) vis = false;
    if (b.id === 'sun' && focus && focus !== b && dist > 200) vis = vis && pr > 4;
    if (vis) {
      const x = (tmpV.x * 0.5 + 0.5) * w, y = (-tmpV.y * 0.5 + 0.5) * h - Math.min(pr, 400) - 2;
      b.label.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
    }
    if (vis !== b._vis) { b._vis = vis; b.label.classList.toggle('on', vis); }
  }
}

// 面板打开时平移投影中心，让聚焦天体始终处于可见区域中央
const vs = { x:0, y:0 };
function updateViewShift(dt) {
  const open = panel.classList.contains('open') && !document.body.classList.contains('noui');
  const mobile = innerWidth <= 860;
  const tx = open && !mobile ? (panel.offsetWidth + 22) / 2 : 0;
  const ty = open && mobile ? (panel.offsetHeight + 96) / 2 : 0;
  const k = 1 - Math.exp(-dt * 5);
  const nx = vs.x + (tx - vs.x) * k, ny = vs.y + (ty - vs.y) * k;
  if (Math.abs(nx - vs.x) < 0.05 && Math.abs(ny - vs.y) < 0.05 && camera.view) return;
  vs.x = Math.abs(nx - tx) < 0.1 ? tx : nx; vs.y = Math.abs(ny - ty) < 0.1 ? ty : ny;
  camera.setViewOffset(innerWidth, innerHeight, vs.x, vs.y, innerWidth, innerHeight);
}

const fpsEl = $('#fps'); let fpsAcc = 0, fpsN = 0;
const dateEl = $('#dateTxt'); let lastDateStr = '';
function updateHUD(dt) {
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsEl.textContent = `${Math.round(fpsN / fpsAcc)} FPS · ${QUALITY[qIndex].name}画质`; fpsAcc = 0; fpsN = 0; }
  const d = new Date(J2000 + simDays * 86400000);
  const s = `${d.getUTCFullYear()} 年 ${d.getUTCMonth() + 1} 月 ${d.getUTCDate()} 日`;
  if (s !== lastDateStr) { dateEl.textContent = s; lastDateStr = s; }
  updateLive(false);
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  U.uClock.value += dt;
  if (!paused) simDays += dt * speed;
  U.uDays.value = simDays - 9000;   // 减去常量以保留着色器浮点精度
  updateBodies(dt);
  scene.updateMatrixWorld();
  readWorld();
  updateTour(dt);
  updateCamera(dt);
  updateViewShift(dt);
  camera.updateMatrixWorld();
  updateUniforms();
  updateLabels();
  composer.render();
  updateHUD(dt);
}

/* =====================================================================
   启动：加载真实地球贴图（失败则程序化生成）→ 烘焙 → 构建 → 开场
   ===================================================================== */
function fatal(msg) { const f = $('#fatal'); f.style.display = 'block'; f.textContent = msg; $('#ldTxt').textContent = ''; }
const setProgress = (p, txt) => { $('#ldBar').style.width = (p * 100).toFixed(0) + '%'; if (txt) $('#ldTxt').textContent = txt; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

function loadTex(url, ms = 9000) {
  return Promise.race([
    new THREE.TextureLoader().loadAsync(url),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms)),
  ]);
}

async function init() {
  const TEX = 'https://threejs.org/examples/textures/planets/';
  const earthReal = Promise.all(['earth_atmos_2048.jpg', 'earth_specular_2048.jpg', 'earth_clouds_1024.png', 'earth_lights_2048.png', 'earth_normal_2048.jpg'].map(f => loadTex(TEX + f))).catch(() => null);
  const moonReal = loadTex(TEX + 'moon_1024.jpg').catch(() => null);

  const jobs = [
    ['sky', '正在绘制银河…', () => bake('T_SKY', 4096, 2048, { uGN:{value:GAL_N} })],
    ...BODIES.filter(b => b.bake && b.id !== 'moon').map(b => [b.id, `正在生成${b.zh}表面…`, () => {
      const k = b.bake, w = k.w || 2048;
      const uni = k.bands ? { uBands:{value:bandTexture(BANDS[k.bands], w + k.seed * 13)}, uTurb:{value:k.turb}, uStretch:{value:k.stretch}, uStreak:{value:k.streak}, uSeed:{value:k.seed} } : {};
      return bake(k.type, w, w / 2, uni, k.defs || {});
    }]),
  ];
  const total = jobs.length + 3;
  let n = 0;
  for (const [id, txt, fn] of jobs) {
    setProgress(n / total, txt); await nextFrame();
    textures[id] = fn(); n++;
  }

  setProgress(n / total, '正在下载地球与月球影像…'); await nextFrame();
  const er = await earthReal;
  if (er) {
    er.forEach(t => { t.anisotropy = MAX_ANISO; });
    textures.earth = bake('T_EARTH_PA', 2048, 1024, { tA:{value:er[0]}, tB:{value:er[1]} });
    textures.earthB = bake('T_EARTH_PB', 2048, 1024, { tA:{value:er[2]}, tB:{value:er[3]} });
    er[4].anisotropy = MAX_ANISO; er[4].wrapS = THREE.RepeatWrapping; textures.earthN = er[4];
    [er[0], er[1], er[2], er[3]].forEach(t => t.dispose());
  } else {
    textures.earth = bake('T_EARTH_A', 2048, 1024);
    textures.earthB = bake('T_EARTH_B', 2048, 1024);
  }
  const mr = await moonReal;
  textures.moon = mr ? bake('T_MOON_P', 1024, 512, { tA:{value:mr} }) : bake('T_MOON', 1024, 512);
  if (mr) mr.dispose();
  n++;

  setProgress(n / total, '正在构建星系…'); await nextFrame();
  skyGroup = buildSky();
  buildSun();
  BODIES.filter(b => b.kind !== 'star' && !b.parent).forEach(buildPlanet);
  BODIES.filter(b => b.parent).forEach(buildMoon);
  buildBelts();
  updateBodies(0); scene.updateMatrixWorld(); readWorld();
  n++;

  setProgress(n / total, '正在编译着色器…'); await nextFrame();
  try { await renderer.compileAsync(scene, camera); } catch (e) { renderer.compile(scene, camera); }
  setProgress(1, '准备就绪'); await nextFrame();

  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  setTimeout(() => $('#loader').classList.add('done'), 250);
  setDockActive('overview');
  goOverview(5.5);
}

init().catch((e) => { console.error(e); fatal('初始化失败：' + (e?.message || e)); });
</script>
</body>
</html>
